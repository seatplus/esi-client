name: Tests

on:
  push:
    branches: [ 2.x, 3.x, 4.x ]
  pull_request:
    branches: [ 2.x, 3.x, 4.x ]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Install Composer dependencies
        run: composer update --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Run Tests (shard ${{ matrix.shard }}/3)
        run: vendor/bin/pest --shard=${{ matrix.shard }}/3 --ci

  all-tests-pass:
    name: ci (tests)
    runs-on: ubuntu-latest
    needs: ci
    if: always()
    steps:
      - name: Check all shards passed
        run: |
          if [[ "${{ needs.ci.result }}" != "success" ]]; then
            echo "One or more test shards failed"
            exit 1
          fi

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: all-tests-pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, pcov

      - name: Install Composer dependencies
        run: composer update --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Run Coverage
        run: vendor/bin/pest --coverage --min=100
